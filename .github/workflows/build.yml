name: Build xinyue_gadget.dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Find source file
      run: |
        find . -name "*.m" | head -20
        SRC=$(find . -name "xinyue_crack.m" | head -1)
        if [ -z "$SRC" ]; then
          SRC=$(find . -name "*.m" | head -1)
        fi
        if [ -z "$SRC" ]; then
          echo "ERROR: No .m source file found!"
          exit 1
        fi
        echo "SOURCE_FILE=$SRC" >> $GITHUB_ENV
        echo "Found source: $SRC"

    - name: Get SDK path
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

    - name: Download frida-gadget.dylib (arm64)
      run: |
        # Get latest frida-gadget for ios-arm64
        # Try specific version first, then latest
        FRIDA_VERSION="16.5.9"
        URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-arm64.dylib.xz"
        echo "Downloading from: $URL"
        curl -L -o frida-gadget.dylib.xz "$URL"
        
        # Verify download
        if [ ! -s frida-gadget.dylib.xz ]; then
          echo "Download failed, trying alternative version..."
          FRIDA_VERSION="16.1.10"
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-ios-arm64.dylib.xz"
          echo "Downloading from: $URL"
          curl -L -o frida-gadget.dylib.xz "$URL"
        fi
        
        if [ ! -s frida-gadget.dylib.xz ]; then
          echo "ERROR: Failed to download frida-gadget"
          exit 1
        fi
        
        # Decompress
        xz -d frida-gadget.dylib.xz
        ls -la frida-gadget.dylib
        file frida-gadget.dylib

    - name: Compile loader dylib (arm64)
      run: |
        clang \
          -arch arm64 \
          -isysroot "$SDK_PATH" \
          -dynamiclib \
          -framework Foundation \
          -fobjc-arc \
          -Wall -Wno-deprecated-declarations \
          -miphoneos-version-min=14.0 \
          -install_name @rpath/xinyue_gadget.dylib \
          -o xinyue_gadget.dylib \
          "$SOURCE_FILE"

    - name: Sign dylibs with ldid (fake sign for jailbreak/TrollStore)
      run: |
        # Install ldid if not available
        if ! command -v ldid &> /dev/null; then
          brew install ldid 2>/dev/null || true
        fi
        
        # Sign both dylibs
        if command -v ldid &> /dev/null; then
          ldid -S xinyue_gadget.dylib
          ldid -S frida-gadget.dylib
          echo "Signed with ldid"
        else
          echo "ldid not found, skipping codesign (will use codesign instead)"
          codesign -f -s - xinyue_gadget.dylib 2>/dev/null || true
          codesign -f -s - frida-gadget.dylib 2>/dev/null || true
        fi

    - name: Verify dylibs
      run: |
        echo "=== xinyue_gadget.dylib ==="
        file xinyue_gadget.dylib
        otool -L xinyue_gadget.dylib
        echo ""
        echo "=== frida-gadget.dylib ==="
        file frida-gadget.dylib
        otool -L frida-gadget.dylib | head -5

    - name: Package both dylibs
      run: |
        mkdir -p artifact
        cp xinyue_gadget.dylib artifact/
        cp frida-gadget.dylib artifact/
        # Create a README for injection
        cat > artifact/INJECT_README.txt << 'EOF'
        === Xinyue Crack - Frida Gadget Edition ===
        
        Two dylibs needed:
        1. xinyue_gadget.dylib  - Loader, embeds JS hook script in data segment
        2. frida-gadget.dylib   - Frida Gadget runtime (arm64)
        
        Both must be injected into the target app.
        
        For TrollStore + TrollFools:
        - Inject BOTH dylibs into com.nbxy.app
        
        For jailbreak (MobileSubstrate):
        - Copy both to /Library/MobileSubstrate/DynamicLibraries/
        - The loader will find frida-gadget via dlopen search paths
        
        For IPA insertion:
        - Place both in Payload/xyld.app/Frameworks/
        - Add LC_LOAD_DYLIB for both to the main binary
        EOF
        ls -la artifact/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xinyue_gadget
        path: artifact/
        retention-days: 90
