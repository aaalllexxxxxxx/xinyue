name: Build xinyue_crack.dylib

on:
  push:
    paths:
      - 'xinyue_crack/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Get SDK path
      id: sdk
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "path=$SDK_PATH" >> $GITHUB_OUTPUT
        echo "SDK Path: $SDK_PATH"

    - name: Compile dylib (arm64)
      working-directory: xinyue_crack
      run: |
        clang \
          -arch arm64 \
          -isysroot "${{ steps.sdk.outputs.path }}" \
          -dynamiclib \
          -flat_namespace \
          -framework Foundation \
          -framework UIKit \
          -fobjc-arc \
          -Wall -Wno-deprecated-declarations \
          -miphoneos-version-min=14.0 \
          -install_name @rpath/xinyue_crack.dylib \
          -o xinyue_crack.dylib \
          xinyue_crack.x

    - name: Verify dylib
      working-directory: xinyue_crack
      run: |
        file xinyue_crack.dylib
        otool -L xinyue_crack.dylib
        nm -U xinyue_crack.dylib | grep -i xinyue

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xinyue_crack.dylib
        path: xinyue_crack/xinyue_crack.dylib
        retention-days: 90
